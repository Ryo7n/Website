<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Icon Generator</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: #f0f0f0;
            font-family: Arial, sans-serif;
        }
        .icon-container {
            margin: 20px;
        }
        canvas {
            border: 2px solid #333;
            margin: 10px;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            margin: 10px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <h1>Princess Vegas Casino - Icon Generator</h1>
    <p>Right-click on each canvas and "Save image as..." to download the icons</p>

    <div class="icon-container">
        <h3>192x192 Icon</h3>
        <canvas id="icon192" width="192" height="192"></canvas>
    </div>

    <div class="icon-container">
        <h3>512x512 Icon</h3>
        <canvas id="icon512" width="512" height="512"></canvas>
    </div>

    <button onclick="generateIcons()">Generate Icons</button>

    <script>
        function drawIcon(canvas) {
            const ctx = canvas.getContext('2d');
            const size = canvas.width;
            const scale = size / 192;

            // Background gradient
            const gradient = ctx.createLinearGradient(0, 0, 0, size);
            gradient.addColorStop(0, '#0000cc');
            gradient.addColorStop(1, '#000066');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, size, size);

            // Round corners
            ctx.globalCompositeOperation = 'destination-in';
            ctx.beginPath();
            ctx.roundRect(0, 0, size, size, 20 * scale);
            ctx.fill();
            ctx.globalCompositeOperation = 'source-over';

            // Crown
            const centerX = size / 2;
            const crownY = 70 * scale;

            // Crown base
            ctx.fillStyle = '#FFD700';
            ctx.fillRect(centerX - 40 * scale, crownY + 30 * scale, 80 * scale, 10 * scale);
            ctx.fillStyle = '#FFA500';
            ctx.fillRect(centerX - 35 * scale, crownY + 40 * scale, 70 * scale, 5 * scale);

            // Crown points
            ctx.fillStyle = '#FFD700';

            // Point 1
            ctx.beginPath();
            ctx.moveTo(centerX - 40 * scale, crownY + 30 * scale);
            ctx.lineTo(centerX - 30 * scale, crownY + 5 * scale);
            ctx.lineTo(centerX - 20 * scale, crownY + 20 * scale);
            ctx.fill();

            // Point 2
            ctx.beginPath();
            ctx.moveTo(centerX - 20 * scale, crownY + 20 * scale);
            ctx.lineTo(centerX - 10 * scale, crownY);
            ctx.lineTo(centerX, crownY + 20 * scale);
            ctx.fill();

            // Point 3
            ctx.beginPath();
            ctx.moveTo(centerX, crownY + 20 * scale);
            ctx.lineTo(centerX + 10 * scale, crownY);
            ctx.lineTo(centerX + 20 * scale, crownY + 20 * scale);
            ctx.fill();

            // Point 4
            ctx.beginPath();
            ctx.moveTo(centerX + 20 * scale, crownY + 20 * scale);
            ctx.lineTo(centerX + 30 * scale, crownY + 5 * scale);
            ctx.lineTo(centerX + 40 * scale, crownY + 30 * scale);
            ctx.fill();

            // Jewels on crown
            const jewels = [
                { x: -30, y: 12, color: '#FF0000', r: 3 },
                { x: -10, y: 8, color: '#00FF00', r: 3 },
                { x: 10, y: 8, color: '#0000FF', r: 3 },
                { x: 30, y: 12, color: '#FF00FF', r: 3 },
                { x: 0, y: 25, color: '#FFFFFF', r: 4 }
            ];

            jewels.forEach(jewel => {
                ctx.fillStyle = jewel.color;
                ctx.beginPath();
                ctx.arc(
                    centerX + jewel.x * scale,
                    crownY + jewel.y * scale,
                    jewel.r * scale,
                    0,
                    Math.PI * 2
                );
                ctx.fill();
            });

            // Text
            ctx.fillStyle = 'white';
            ctx.font = `bold ${24 * scale}px Arial`;
            ctx.textAlign = 'center';
            ctx.fillText('PRINCESS', centerX, 130 * scale);

            ctx.fillStyle = '#FFD700';
            ctx.font = `bold ${20 * scale}px Arial`;
            ctx.fillText('VEGAS', centerX, 155 * scale);
        }

        function generateIcons() {
            const canvas192 = document.getElementById('icon192');
            const canvas512 = document.getElementById('icon512');

            drawIcon(canvas192);
            drawIcon(canvas512);

            alert('Icons generated! Right-click on each canvas and select "Save image as..." to download.');
        }

        // Generate on load
        window.addEventListener('load', generateIcons);
    </script>
</body>
</html>
