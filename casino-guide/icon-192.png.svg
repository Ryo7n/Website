<svg width="192" height="192" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0000cc;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#000066;stop-opacity:1" />
    </linearGradient>
  </defs>

  <rect width="192" height="192" fill="url(#bgGrad)" rx="20"/>

  <!-- Crown -->
  <g transform="translate(96, 70)">
    <!-- Crown base -->
    <rect x="-40" y="30" width="80" height="10" fill="#FFD700"/>
    <rect x="-35" y="40" width="70" height="5" fill="#FFA500"/>

    <!-- Crown points -->
    <polygon points="-40,30 -30,5 -20,20" fill="#FFD700"/>
    <polygon points="-20,20 -10,0 0,20" fill="#FFD700"/>
    <polygon points="0,20 10,0 20,20" fill="#FFD700"/>
    <polygon points="20,20 30,5 40,30" fill="#FFD700"/>

    <!-- Jewels -->
    <circle cx="-30" cy="12" r="3" fill="#FF0000"/>
    <circle cx="-10" cy="8" r="3" fill="#00FF00"/>
    <circle cx="10" cy="8" r="3" fill="#0000FF"/>
    <circle cx="30" cy="12" r="3" fill="#FF00FF"/>
    <circle cx="0" cy="25" r="4" fill="#FFFFFF"/>
  </g>

  <!-- Text -->
  <text x="96" y="130" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="white" text-anchor="middle">PRINCESS</text>
  <text x="96" y="155" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#FFD700" text-anchor="middle">VEGAS</text>
</svg>
